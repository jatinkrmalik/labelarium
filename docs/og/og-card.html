<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bodoni Moda"; src: url("../../fonts/bodoni-moda-400.ttf") format("truetype"); }
@font-face { font-family: Jost; src: url("../../fonts/jost-600.ttf") format("truetype"); font-weight: 600; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #efe7d6; }
.plate {
  position: absolute; left: 36px; top: 36px; width: 1128px; height: 558px;
  background: #fff; border: 3px solid #141414;
  box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 9px #141414;
}
.marks { position: absolute; top: 28px; right: 32px; display: flex; gap: 10px; align-items: center; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #c8342a; }
.sq { width: 16px; height: 16px; background: #1f3f8f; }
.tri { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid #e8b820; }
.icon { position: absolute; left: 56px; top: 64px; width: 220px; height: 220px; object-fit: contain; }
.copy { position: absolute; left: 320px; top: 64px; right: 80px; }
.eyebrow {
  display: flex; align-items: center; gap: 12px;
  font-family: Jost, sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.18em;
  margin-bottom: 12px;
}
.eyebrow .rule { width: 32px; height: 2px; background: #141414; }
h1 {
  font-family: "Bodoni Moda", Didot, Georgia, serif;
  font-size: 112px; line-height: 0.95; color: #141414;
  -webkit-text-stroke: 1.4px #141414;
}
.tag {
  margin-top: 18px;
  font-family: Jost, sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3; color: #141414;
}
.works {
  position: absolute; left: 56px; bottom: 148px;
  font-family: Jost, sans-serif; font-weight: 600; font-size: 15px;
  letter-spacing: 0.18em; color: #141414;
  display: flex; align-items: center; gap: 12px;
}
.works .rule { width: 28px; height: 2px; background: #141414; }
.tape {
  position: absolute; left: 40px; right: 40px; bottom: 34px; height: 108px;
  background: #e8b820; border: 5px solid #141414;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; gap: 10px;
}
.cell {
  flex: 1; height: 78px; background: #fff; border: 3px solid #141414;
  display: flex; align-items: center; justify-content: center; padding: 8px 10px;
}
.cell img { max-height: 46px; max-width: 100%; object-fit: contain; }
</style></head>
<body>
  <div class="plate">
    <div class="marks"><div class="dot"></div><div class="sq"></div><div class="tri"></div></div>
    <img class="icon" src="icon-512.png" alt="">
    <div class="copy">
      <div class="eyebrow"><span class="rule"></span>THE LABEL MAKER COMPANION</div>
      <h1>Labelarium</h1>
      <p class="tag">Every symbol, frame, template and shortcut<br>of your label maker.</p>
    </div>
    <div class="works"><span class="rule"></span>WORKS WITH</div>
    <div class="tape">
      <div class="cell"><img src="logos/brother.svg" alt="Brother"></div>
      <div class="cell"><img src="logos/dymo.png" alt="DYMO"></div>
      <div class="cell"><img src="logos/niimbot-en.png" alt="NIIMBOT"></div>
      <div class="cell"><img src="logos/brady.svg" alt="Brady"></div>
      <div class="cell"><img src="logos/phomemo-ink.png" alt="Phomemo"></div>
    </div>
  </div>
</body></html>
