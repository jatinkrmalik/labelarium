<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- depth offset -->
    <rect x="36" y="28" width="76" height="76" rx="18" fill="#efe7d6" stroke="#141414" stroke-width="2"/>
    <!-- front face of the cube -->
    <rect x="16" y="18" width="76" height="76" rx="18" fill="#fff" stroke="#141414" stroke-width="2.2"/>
    <rect x="22" y="24" width="64" height="64" rx="14" fill="#fff" stroke="#141414" stroke-width="0.9"/>
    <!-- top seam -->
    <path d="M28 32 h52" stroke="#141414" stroke-width="0.9"/>
    <!-- LED -->
    <circle cx="54" cy="22" r="2.8" fill="#c8342a" stroke="#141414" stroke-width="0.95"/>
    <!-- cassette cover -->
    <rect x="36" y="40" width="36" height="36" rx="7" fill="#efe7d6" stroke="#141414" stroke-width="1.5"/>
    <rect x="44" y="48" width="20" height="20" rx="4" fill="#fff" stroke="#141414" stroke-width="1"/>
    <circle cx="54" cy="58" r="2.2" fill="#141414"/>
    <!-- tape slot + tape -->
    <rect x="16" y="44" width="8" height="18" rx="1.6" fill="#141414"/>
    
    <rect x="1" y="46" width="24" height="10" rx="1.1" fill="#efe7d6" stroke="#141414" stroke-width="1.25"/>
    <rect x="3.2" y="48.0" width="18.0" height="1.15" fill="#141414"/>
    <rect x="3.2" y="50.5" width="15.0" height="1.15" fill="#141414"/>
    <!-- USB / power / LED on depth face -->
    <rect x="100" y="50" width="6.5" height="9" rx="1.2" fill="#fff" stroke="#141414" stroke-width="1"/>
    <circle cx="103.2" cy="70" r="2.6" fill="#fff" stroke="#141414" stroke-width="1"/>
    <rect x="101.2" y="80" width="4" height="5" rx="0.7" fill="#141414"/>
    <!-- foot -->
    <rect x="32" y="92" width="44" height="7" rx="2.2" fill="#efe7d6" stroke="#141414" stroke-width="1.15"/>
  </g>
</svg>
