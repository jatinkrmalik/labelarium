name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Site layout and device packs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate site/ files and device packs
        run: python3 scripts/ci-check-site.py

      - name: Pre-render covers every sitemap URL
        run: node scripts/prerender.mjs --check
